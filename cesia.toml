[project]
name = "ceres"
cesia = "1.3"

# The tests run the pages without a window, on the headless back-end, and serve their live screens themselves on a
# free port of 127.0.0.1. tests/sdl draws the page of the guide with SDL3 under SDL's dummy driver, which needs no
# screen: it passes without a word on a machine that has no SDL3.
[test]
allow = ["ffi=SDL3", "ffi=SDL3_ttf", "read=src/sdl/fonts"]
timeout = "30"

# The invoices page of the guide in a window, with its app served in the same program.
[tasks.demo]
file = "examples/invoices/main.ce"
allow = ["ffi=SDL3", "ffi=SDL3_ttf", "read=src/sdl/fonts", "net=127.0.0.1"]

# The page of examples/hello in a browser, compiled to WebAssembly first (cesia build --target wasm
# examples/hello/hello.ce): http://127.0.0.1:8080/.
[tasks.hello]
file = "examples/hello/serve.ce"
allow = ["net=:8080", "read=examples/hello"]

# The invoices page in a browser, compiled to WebAssembly (cesia build --target wasm examples/invoices/browser.ce
# first), served with its app's live screen: http://127.0.0.1:8080/browser.html.
[tasks.web]
file = "examples/invoices/serve.ce"
allow = ["net=127.0.0.1", "read=examples/invoices", "read=tests/web", "env=PORT"]

# A table of 100,000 rows kept in a page, in a browser, as Centauri's admin shows the clients of an office: cesia build
# --target wasm bench/web/table.ce first, then http://127.0.0.1:8080/table.html; tests/web/table.html measures it.
[tasks.webtable]
file = "bench/web/serve.ce"
allow = ["net=127.0.0.1", "read=bench/web", "read=tests/web", "env=PORT"]

# The measures of docs/book/speed.md: frame times of the invoices page and of a table of 100,000 rows.
[tasks.bench]
file = "bench/frames.ce"
allow = ["ffi=SDL3", "ffi=SDL3_ttf", "read=src/sdl/fonts", "net=127.0.0.1", "read=/proc/self"]

# The cost of the invoices page at rest: CPU and memory of sdl.Run while nothing changes.
[tasks.still]
file = "bench/still.ce"
allow = ["ffi=SDL3", "ffi=SDL3_ttf", "read=src/sdl/fonts", "net=127.0.0.1", "read=/proc/self"]

[site]
title = "Ceres"
source = "https://github.com/www-celestial/ceres/blob/main/"
color = "#111111"

# The pictures of shots/, drawn by the SDL3 back-end without a screen.
[tasks.shots]
file = "tools/shot.ce"
allow = ["ffi=SDL3", "ffi=SDL3_ttf", "read=src/sdl/fonts", "net=127.0.0.1", "write=shots"]

# The test of the invoices page in a browser, compiled to WebAssembly first (tools/webshot.sh does both).
[tasks.webshot]
file = "tools/webshot.ce"
allow = ["net=127.0.0.1", "read=examples/invoices", "read=tests/web", "exec", "env=CHROME", "read=/tmp/ceres-webshot", "write=/tmp/ceres-webshot", "write=shots"]

# The page of examples/desk, laid out as a desktop tool, in a browser, compiled to WebAssembly first (cesia build
# --target wasm examples/desk/desk.ce): http://127.0.0.1:8080/ (PORT for another port).
[tasks.desk]
file = "examples/desk/serve.ce"
allow = ["net=127.0.0.1", "read=examples/desk", "env=PORT"]

# The same page in a window of SDL3.
[tasks.desk-window]
file = "examples/desk/window.ce"
allow = ["ffi=SDL3", "ffi=SDL3_ttf", "read=src/sdl/fonts"]
