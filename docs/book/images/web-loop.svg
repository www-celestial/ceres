<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336">
<title>The loop of a page in the browser. The browser's events, a click, a key, a text typed, a new size, and the pushes of the live screen go on one channel, where the page's code waits and runs nothing. An event: web.Handle, web.Update; when the page changed, Wake asks for the browser's next frame; at the frame, web.Encoded and web.Patch give only what changed, which ceres.js paints with WebGL2 in one draw call and writes into the hidden DOM.</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#111}
.c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.m{fill:#5c5c5c}
.a{fill:#0b57d0}
.h{font-weight:600}
.b{fill:#fff;stroke:#111;stroke-width:1}
.ba{fill:#fff;stroke:#0b57d0;stroke-width:1.6}
.g{fill:#f2f2f2;stroke:#cfcfcf;stroke-width:1}
.l{stroke:#111;stroke-width:1.2;fill:none}
.la{stroke:#0b57d0;stroke-width:1.4;fill:none}
.d{stroke:#5c5c5c;stroke-width:1.2;stroke-dasharray:4 3;fill:none}
.hd{fill:#111}
.hda{fill:#0b57d0}
.hdd{fill:#5c5c5c}
</style>
<rect width="720" height="336" fill="#fff"/>
<text x="150" y="24" class="h" text-anchor="middle">the browser: web/ceres.js</text>
<text x="570" y="24" class="h" text-anchor="middle">the page, in WebAssembly: src/browser</text>
<rect class="b" x="20" y="40" width="260" height="40"/>
<text x="32" y="65">a click, a key, a text typed, a size</text>
<rect class="ba" x="440" y="40" width="260" height="40"/>
<text x="452" y="65" class="c">fiber.Receive(events): waits</text>
<line class="l" x1="280" y1="60" x2="432.0" y2="60.0"/><polygon class="hd" points="440,60 432.0,64.0 432.0,56.0"/>
<text x="360" y="53" class="m" text-anchor="middle">each event</text>
<rect class="b" x="20" y="96" width="260" height="40"/>
<text x="32" y="121">a push of the app, on the WebSocket</text>
<line class="l" x1="280" y1="112" x2="432.2" y2="75.8"/><polygon class="hd" points="440,74 433.1,79.7 431.3,72.0"/>
<text x="360" y="104" class="m" text-anchor="middle">wakes it</text>
<rect class="b" x="440" y="96" width="260" height="40"/>
<text x="452" y="121" class="c">web.Handle, then web.Update</text>
<line class="l" x1="570" y1="80" x2="570.0" y2="88.0"/><polygon class="hd" points="570,96 566.0,88.0 574.0,88.0"/>
<rect class="b" x="440" y="152" width="260" height="40"/>
<text x="452" y="177" class="c">the page changed: Wake()</text>
<line class="l" x1="570" y1="136" x2="570.0" y2="144.0"/><polygon class="hd" points="570,152 566.0,144.0 574.0,144.0"/>
<rect class="b" x="20" y="152" width="260" height="40"/>
<text x="32" y="177">at the browser's next frame</text>
<line class="l" x1="440" y1="172" x2="288.0" y2="172.0"/><polygon class="hd" points="280,172 288.0,168.0 288.0,176.0"/>
<text x="360" y="165" class="m" text-anchor="middle">asks a frame</text>
<rect class="b" x="440" y="208" width="260" height="40"/>
<text x="452" y="233" class="c">web.Encoded, web.Patch</text>
<line class="l" x1="280" y1="186" x2="432.2" y2="220.2"/><polygon class="hd" points="440,222 431.3,224.1 433.1,216.3"/>
<text x="330" y="214" class="c" text-anchor="middle">&quot;frame&quot;</text>
<rect class="b" x="20" y="264" width="260" height="52"/>
<text x="32" y="285">Paint: WebGL2, one draw call</text>
<text x="32" y="304">Patch: the hidden DOM</text>
<line class="l" x1="440" y1="240" x2="287.8" y2="278.1"/><polygon class="hd" points="280,280 286.8,274.2 288.7,281.9"/>
<text x="392" y="278" class="m" text-anchor="middle">what changed</text>
<text x="440" y="288">Between two events the page's code</text>
<text x="440" y="306" class="m">doesn't run: a still page costs nothing.</text>
</svg>
