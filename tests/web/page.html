<!doctype html>
<meta charset="utf-8">
<title>Ceres page test</title>
<style>html, body { margin: 0; } #page { width: 1100px; height: 860px; }</style>
<div id="page"><canvas></canvas></div>
<script type="module" src="/browser.js"></script>
<script type="module">
// The test of the invoices page in a browser, compiled from Cesia to WebAssembly (examples/invoices/browser.ce) and
// served live by examples/invoices/serve.ce: it waits for the rows of the table in the hidden DOM, clicks into the field
// Due, types "Brun", then Backspace and a space (which types, so the page doesn't get it as a key), and writes in the
// title what the page shows: its rows, its fields, the text of the field, and whether it painted again.
import { Tree, Stats, Measure } from '/ceres.js'
const checked = /[?&]ceres-check\b/.test(location.search) // the hidden DOM checked after every frame (check.js)
if (checked) await import('/tests/check.js')
const wait = ms => new Promise(r => setTimeout(r, ms))
const until = async (f, ms = 20000) => { for (let t = 0; t < ms && !f(); t += 50) await wait(50); return f() }
const find = (node, f) => f(node) ? node : node.Kids.map(k => find(k, f)).find(Boolean)
const field = name => { const t = Tree(); return t && find(JSON.parse(t), n => n.Role === 'textbox' && n.Name === name) }
const layer = () => document.querySelector('#page > div')
await until(() => layer() && layer().querySelectorAll('[role=row]').length >= 15)
const rows = layer().querySelectorAll('[role=row]').length, inputs = layer().querySelectorAll('input').length
const due = field('Due'), canvas = document.querySelector('canvas'), r = canvas.getBoundingClientRect()
for (const type of ['pointerdown', 'pointerup'])
  canvas.dispatchEvent(new PointerEvent(type, { clientX: r.left + due.X + 10, clientY: r.top + due.Y + 5, button: 0, bubbles: true }))
await until(() => field('Due').Focused)
const before = Stats().frames.length
const input = layer().querySelector('input[aria-label=Due]')
input.value = 'Brun'
input.dispatchEvent(new InputEvent('input', { data: 'Brun', inputType: 'insertText' }))
for (const key of ['Backspace', ' ']) input.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }))
await until(() => field('Due').Value === 'Bru', 5000)
await wait(100)
document.title = 'done ' + rows + ' rows, ' + inputs + ' inputs, field ' + field('Due').Value + ', input left ' + JSON.stringify(input.value) +
  ', painted again ' + (Stats().frames.length > before) + ', measure ' + Math.round(Measure('Invoices', 14, 'body')) +
  (checked ? ', checks ' + JSON.stringify(globalThis.ceresChecks) : '')
</script>
