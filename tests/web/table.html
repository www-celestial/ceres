<!doctype html>
<meta charset="utf-8">
<title>Ceres table frames</title>
<style>html, body { margin: 0; } #page { width: 1280px; height: 900px; }</style>
<div id="page"><canvas></canvas></div>
<script type="module" src="/table.js"></script>
<script type="module">
// The measures of a table of 100,000 rows kept in the page (bench/web/table.ce) in a browser: 120 notches of the wheel,
// each in a frame of its own, a sort by a click on a title, and 30 letters typed in a field. For each, the page's own
// work in a frame, from the browser's call to the page painted (ceres.js Stats: frames less waits), p50, p99 and the
// largest, in ms; the title gives them as JSON. Marks of the page's timeline (ceres-scroll, ceres-sort, ceres-typing,
// ceres-end) tell the steps apart in a trace.
import { Stats, Tree } from '/ceres.js'
const wait = ms => new Promise(r => setTimeout(r, ms))
const frame = () => new Promise(r => requestAnimationFrame(() => r()))
const until = async (f, ms = 60000) => { for (let t = 0; t < ms && !f(); t += 20) await wait(20); return f() }
const layer = () => document.querySelector('#page > div')
const find = (n, f) => f(n) ? n : n.Kids.map(k => find(k, f)).find(Boolean)
await until(() => layer() && layer().querySelectorAll('[role=row]').length >= 15)
const first = Stats().firstPaint
const canvas = document.querySelector('canvas'), r = canvas.getBoundingClientRect()
const q = (xs, p) => { const s = [...xs].sort((a, b) => a - b); return s.length ? +s[Math.min(s.length - 1, Math.floor(p * s.length))].toFixed(2) : null }
const sum = xs => ({ n: xs.length, p50: q(xs, 0.5), p99: q(xs, 0.99), max: q(xs, 1) })
const work = f0 => Stats().frames.slice(f0).map((f, i) => f - Stats().waits[f0 + i])
const click = (x, y) => { for (const type of ['pointerdown', 'pointerup']) canvas.dispatchEvent(new PointerEvent(type, { clientX: r.left + x, clientY: r.top + y, button: 0, bubbles: true })) }
let prof = null
if (/[?&]prof\b/.test(location.search)) prof = await import('/prof.js') // the phases of an instrumented build
const marks = () => prof ? prof.Marks().length : 0
const phases = m0 => prof ? prof.Summary(m0) : undefined
await wait(500)
const table = find(JSON.parse(Tree()), n => n.Role === 'table')
let f0 = Stats().frames.length, m0 = marks()
performance.mark('ceres-scroll')
for (let k = 0; k < 120; k++) {
  canvas.dispatchEvent(new WheelEvent('wheel', { clientX: r.left + table.X + 300, clientY: r.top + table.Y + 120, deltaY: 100, bubbles: true, cancelable: true }))
  await frame()
}
await wait(300)
const scroll = work(f0), scrollPhases = phases(m0)
f0 = Stats().frames.length; m0 = marks()
performance.mark('ceres-sort')
click(table.X + 170, table.Y + 8)
await until(() => (find(JSON.parse(Tree()), n => n.Role === 'cell' && /^Client n° /.test(n.Name)) || {}).Name === 'Client n° 1', 10000)
await wait(500)
const sort = work(f0), sortPhases = phases(m0)
const field = find(JSON.parse(Tree()), n => n.Role === 'textbox' && n.Name === 'Filter')
click(field.X + 10, field.Y + 5)
await until(() => find(JSON.parse(Tree()), n => n.Role === 'textbox' && n.Name === 'Filter').Focused)
await wait(200)
const input = layer().querySelector('input[aria-label=Filter]')
f0 = Stats().frames.length; m0 = marks()
performance.mark('ceres-typing')
for (let k = 0; k < 30; k++) {
  input.value = String.fromCharCode(97 + k % 26)
  input.dispatchEvent(new InputEvent('input', { data: input.value, inputType: 'insertText' }))
  await wait(50)
}
await wait(300)
const typing = work(f0), typingPhases = phases(m0)
performance.mark('ceres-end')
const typed = find(JSON.parse(Tree()), n => n.Role === 'textbox' && n.Name === 'Filter').Value
document.title = 'done ' + JSON.stringify({ firstPaint: +first.toFixed(1), typed: typed.length, scrollWork: sum(scroll), sortWork: sum(sort), typingWork: sum(typing), scrollPhases, sortPhases, typingPhases })
</script>
