<!doctype html>
<meta charset="utf-8">
<title>Ceres frames</title>
<style>html, body { margin: 0; } #page { width: 1100px; height: 860px; }</style>
<div id="page"><canvas></canvas></div>
<script type="module" src="/browser.js"></script>
<script type="module">
// The measures of docs/book/speed.md in a browser: the invoices page compiled from Cesia to WebAssembly, its first
// paint, then 200 notches of the wheel over its table of 100,000 rows, one every 16 ms, and 30 letters typed in a
// field: for each frame, the time from the browser's frame to the page painted (ceres.js Stats), the page's own work in
// it, from the browser's call to the page painted (Work), the wait before that call (Wait), the part that WebGL took,
// and the time between two frames of the browser. The title gives them as JSON: p50, p99 and the largest, in ms.
import { Stats, Tree } from '/ceres.js'
let prof = null
if (/[?&]prof\b/.test(location.search)) prof = await import('/prof.js') // the phases of an instrumented build
const marks = () => prof ? prof.Marks().length : 0
const wait = ms => new Promise(r => setTimeout(r, ms))
const until = async (f, ms = 30000) => { for (let t = 0; t < ms && !f(); t += 20) await wait(20); return f() }
const layer = () => document.querySelector('#page > div')
await until(() => layer() && layer().querySelectorAll('[role=row]').length >= 15)
const first = Stats().firstPaint
const canvas = document.querySelector('canvas'), r = canvas.getBoundingClientRect()
const ticks = []
let ticking = true
const tick = t => { ticks.push(t); if (ticking) requestAnimationFrame(tick) }
requestAnimationFrame(tick)
const q = (xs, p) => { const s = [...xs].sort((a, b) => a - b); return s.length ? +s[Math.min(s.length - 1, Math.floor(p * s.length))].toFixed(2) : null }
const sum = xs => ({ n: xs.length, p50: q(xs, 0.5), p99: q(xs, 0.99), max: q(xs, 1) })
const gaps = xs => xs.slice(1).map((t, i) => t - xs[i])
await wait(500)
const f0 = Stats().frames.length, t0 = ticks.length, m0 = marks()
for (let k = 0; k < 200; k++) {
  canvas.dispatchEvent(new WheelEvent('wheel', { clientX: r.left + 500, clientY: r.top + 600, deltaY: k < 100 ? 100 : -100, bubbles: true, cancelable: true }))
  await wait(16)
}
await wait(300)
const scrollPhases = prof ? prof.Summary(m0) : undefined
const scroll = Stats().frames.slice(f0), scrollWaits = Stats().waits.slice(f0), scrollPaints = Stats().paints.slice(f0), scrollTicks = ticks.slice(t0)
const due = (function find(n) { return n.Role === 'textbox' && n.Name === 'Amount' ? n : n.Kids.map(find).find(Boolean) })(JSON.parse(Tree()))
for (const type of ['pointerdown', 'pointerup'])
  canvas.dispatchEvent(new PointerEvent(type, { clientX: r.left + due.X + 10, clientY: r.top + due.Y + 5, button: 0, bubbles: true }))
await wait(200)
const input = layer().querySelector('input[aria-label=Amount]')
const f1 = Stats().frames.length, t1 = ticks.length, m1 = marks()
for (let k = 0; k < 30; k++) {
  input.value = String(k % 10)
  input.dispatchEvent(new InputEvent('input', { data: input.value, inputType: 'insertText' }))
  await wait(50)
}
await wait(300)
ticking = false
const typingPhases = prof ? prof.Summary(m1) : undefined
const typing = Stats().frames.slice(f1), typingWaits = Stats().waits.slice(f1), typingTicks = ticks.slice(t1)
const work = (fs, ws) => fs.map((f, i) => f - ws[i])
document.title = 'done ' + JSON.stringify({ firstPaint: +first.toFixed(1), scroll: sum(scroll), scrollWork: sum(work(scroll, scrollWaits)), scrollWait: sum(scrollWaits), scrollPaint: sum(scrollPaints), scrollGaps: sum(gaps(scrollTicks)), typing: sum(typing), typingWork: sum(work(typing, typingWaits)), typingGaps: sum(gaps(typingTicks)), scrollPhases, typingPhases })
</script>
